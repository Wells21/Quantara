schema_version: v2.1
edge_id: DAX/closehedgingflow_long
asset: DAX
family: closehedgingflow
side_name: long
side_value: 1
edge_stem: dax_closehedgingflow_long
status: deployability_pass
runtime_py: runtime.py

bar_contract:
 bar_type: standard_quote_tick
 threshold_unit: ticks
 proxy_value_policy: backward_compatible_tick_count_only

alpha_contract:
 candidate_event_generator: closehedgingflow_long_v1_t1c_clock_trigger
 primary_side_rule: "first bar closing at or after 16:30 Berlin (1 h before the 17:30 close) on a weekday (<= 30 min), log(close / last close at or before the previous weekday's 17:30) > 0 -> LONG"
 edge_specific_features_allowed: false
 requires_ffd: true
 requires_regime: true

labeling:
 row_builder: closehedgingflow_long_v1_1r_triple_barrier_model_rows
 vertical_horizon: 1000  # legacy bar-count field required by the edge.yaml contract; labels use vertical_horizon_hours
 vertical_horizon_hours: 16.0  # LOCKED 2026-11-10 Gate C winner H8_E150_V16_PT2_SL1 (full history era-scaled +0.048 R; PBO 0.462, Prob 0.198; DSR 0.977; stress +0.045 R; 2022+ +0.042 R)
 pt_multiplier: 2.0
 sl_multiplier: 1.0
 tie_policy: sl_first
 tick_resolution_price: mid
 long_barrier_contract: pt_price_above_entry_sl_price_below_entry
 live_scoring_must_not_use_label_columns: true

research:
 cv: combinatorial_purged_cv
 n_folds: 5
 n_test_folds: 2
 manual_embargo_size: 100
 weights: class_weight_mode_x_event_vol_x_average_uniqueness

probability:
 flow: raw_probability -> sigmoid calibrated_probability -> AFML bet size -> calibrated-threshold decision
 final_edge_threshold_space: calibrated_probability
 final_live_threshold_source: allocator_live_manifest

runtime_contract:
 required_functions:
   - load_contract
   - validate_environment
   - build_features
   - generate_candidate_events
   - build_model_rows
   - load_model
   - load_calibrator
   - score
   - explain_missing_features
 dashboard_may_call:
   - validate_environment
   - build_features
   - generate_candidate_events
   - build_model_rows
   - score
 dashboard_must_not_compute_features: true

notes:
 - CAUTION: card T1c is itself an owner-ordered POST-HOC re-test (2026-11-04) of T1 with the live-tradable entry bar; read every result with that status. Gate 0 verdict re-read under D092 (firing rate only) on 2026-11-10.
 - DAX/closehedgingflow_long is the T1c long (Gate 0 PASS under D090 with D092 firing rate >= 2/week (stored result re-read 2026-11-10); Gate A 2026-11-10).
 - Trigger: first bar closing at or after 16:30 Berlin (1 h before the 17:30 close) on a weekday (<= 30 min), log(close / last close at or before the previous weekday's 17:30) > 0 -> LONG. Implementation shared/edges/thesis_triggers.py (Gate 0 parity IDENTICAL).
 - Session_*, Clock_Signal and Event_Vol are event/control/context fields, not model-input schema features; the generic feature_schema.json is copied verbatim.
 - Geometry LOCKED 2026-11-10: H8_E150_V16_PT2_SL1 (LOCKED 2026-11-10 Gate C winner H8_E150_V16_PT2_SL1 (full history era-scaled +0.048 R; PBO 0.462, Prob 0.198; DSR 0.977; stress +0.045 R; 2022+ +0.042 R)).

# Thesis card -- AFML Ch.1 s.1.3.1.3 (p.7) strategist station; QUANTARA_MLDP_DOCTRINE principle 1.
thesis:
  schema_version: "thesis_card_v1"
  written_utc: "2026-11-09"
  provenance: "pre_registered"
  review_status: "gate0_d090_d092_pass_2026-11-10 (owner: firing rate >= 2/week)"
  card: "docs/mldp/campaign/NASDAQ_2026-11/T1c_causal_entry_retest/PREREGISTRATION.md"
  trigger_summary: "LONG: first bar closing at or after 16:30 Berlin (1 h before the 17:30 close) on a weekday (<= 30 min), log(close / last close at or before the previous weekday's 17:30) > 0 -> LONG; locked H8_E150_V16_PT2_SL1."
  mechanism: "Hedgers of leveraged / short-gamma positions trade with the day's move into the session close, so the day's direction continues into the close (Baltussen, Da, Lammers and Martens 2021 JFE)."
  who_loses_and_why: "Late-day liquidity providers who take the other side of the predictable hedging flow into the close."
  regimes:
    should_work:
      - "high-volatility days with large intraday moves"
    should_fail:
      - "quiet days and days where the move reverses on news before the close"
  counterfactuals:
    C1:
      statement: "Drift-neutral C1: the same long on an opposite-sign day should do worse."
      test: "gate0_tool T1c C1 (D090 verdict file beside the card)."
  falsifiers:
    F1:
      statement: "The post-Gate C D090 re-check fails at the locked cell."
      test: "gate0_tool GATE0_CELL + gate0_verdict_d090.py."
    F2:
      statement: "Live per-bet results fail the decommission rule for a sustained period."
      test: "decommission rule on live realized bets."
